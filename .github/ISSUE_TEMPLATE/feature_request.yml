name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem first — it helps us find the best solution, which may differ
        from the one you have in mind.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Include example inputs, config or output if you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Trigger / workflow
        - PRD sources (GitHub Issue, Jira, Notion)
        - Diff preprocessing / large PRs
        - Scenario quality / prompt
        - PR comment / Slack / job summary output
        - CLI
        - Docs
        - Other
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this (see CONTRIBUTING.md).
