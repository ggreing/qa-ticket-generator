<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="890" viewBox="0 0 800 890" font-family="'Malgun Gothic','맑은 고딕',sans-serif">
  <title>전처리 파이프라인 상세</title>
